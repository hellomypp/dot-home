# Local-only authentication. Do not enable this profile on a public deployment.
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/dothome;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  session:
    jdbc:
      initialize-schema: never
server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        secure: false
app:
  origin: ${APP_ORIGIN:http://localhost:5173}
