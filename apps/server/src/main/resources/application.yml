spring:
  application:
    name: dot-home
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dothome?serverTimezone=UTC}
    username: ${DB_USER:dothome}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
  session:
    timeout: 12h
    jdbc:
      initialize-schema: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  address: 127.0.0.1
  port: 8080
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
app:
  origin: ${APP_ORIGIN:https://localhost}
  household-deletion-enabled: ${HOUSEHOLD_DELETION_ENABLED:false}
