# Local file database; no arbitrary account-key authentication in this profile.
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/dothome;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
